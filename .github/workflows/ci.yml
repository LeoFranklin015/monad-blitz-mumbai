name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run backend:check
      - run: npm run build

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run smoke
        env: { SMOKE_LOG: /tmp/smoke }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: smoke-logs, path: /tmp/smoke/*.log }

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile local build
      - run: docker run --rm --entrypoint nginx weekend-options-web -t
