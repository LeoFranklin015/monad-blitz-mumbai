server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

  # backend API on the same origin, so no CORS is needed in production
  location /api/ {
    proxy_pass http://backend:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 15s;
  }

  # operators only: keep /api/metrics and /api/status off the public internet
  location ~ ^/api/(metrics|status)$ {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://backend:8787/$1;
  }

  # deployment files change on redeploy: never cache
  location /deployments/ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # hashed build assets: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
