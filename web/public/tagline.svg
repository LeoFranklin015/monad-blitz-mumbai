<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" fill="none" role="img" aria-label="Weekend Options — Never get liquidated">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#12151a"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c52ff"/>
      <stop offset="0.5" stop-color="#3ecf8e"/>
      <stop offset="1" stop-color="#8c52ff"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2555a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2555a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .tag { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; }
      .sub { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; font-weight: 400; letter-spacing: 6px; }
    </style>
  </defs>

  <rect width="860" height="190" fill="url(#bg)"/>

  <!-- faint gap chart motif: flat frozen line, then a drop that flattens at a floor -->
  <g opacity="0.5">
    <path d="M40 70 L300 70" stroke="#5d6575" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <path d="M300 70 L380 150 L820 150" fill="none" stroke="#3ecf8e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2s" begin="0.2s" fill="freeze"/>
    </path>
    <path d="M300 70 L820 165 L820 185 L300 185 Z" fill="url(#fade)" opacity="0">
      <animate attributeName="opacity" from="0" to="0.5" dur="1s" begin="1.6s" fill="freeze"/>
    </path>
    <line x1="300" y1="20" x2="300" y2="170" stroke="#8c52ff" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  </g>

  <!-- tagline -->
  <text class="tag" x="40" y="112" font-size="46" fill="#e8ebf0" opacity="0">
    Never get
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
  </text>
  <text class="tag" x="320" y="112" font-size="46" fill="url(#sweep)" opacity="0">
    liquidated.
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- subline -->
  <text class="sub" x="42" y="150" font-size="13" fill="#8a93a3" opacity="0">
    ONCHAIN OPTIONS · TOKENIZED STOCKS · MONAD
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.4s" fill="freeze"/>
  </text>
</svg>
